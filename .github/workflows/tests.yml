name: tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # matches FreeCAD 1.0's bundled Python
      - name: Run core unit tests (standard library only)
        run: python -m unittest discover -s tests -v
