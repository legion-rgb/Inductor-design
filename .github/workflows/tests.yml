name: tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # matches FreeCAD 1.0's bundled Python
      - name: Core and input tests (standard library only; UI tests skip)
        run: python -m unittest discover -s tests -v

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: PySide6 (CI only; FreeCAD ships its own Qt bindings)
        run: pip install PySide6-Essentials
      - name: All tests including offscreen dialog tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

  cad:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: freecad
          create-args: >-
            -c conda-forge
            freecad=1.0
            python=3.11
          cache-environment: true
      - name: Coil-form tests in FreeCAD
        run: FREECAD_LIB=$CONDA_PREFIX/lib python -m unittest tests.test_inductor_cad -v
